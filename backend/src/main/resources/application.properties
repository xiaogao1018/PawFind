spring.application.name=backend

# MySQL 数据库连接配置
spring.datasource.url=jdbc:mysql://localhost:3306/pawfind?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=pawfind_app
#${DB_PASSWORD} 表示：Spring Boot 会从环境变量中读取数据库密码。
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT 签名密钥（从环境变量读取）
jwt.secret=${JWT_SECRET}

# JWT 有效期：2 小时（毫秒）
jwt.expiration-ms=7200000