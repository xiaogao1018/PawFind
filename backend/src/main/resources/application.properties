spring.application.name=backend

# MySQL 数据库连接配置
spring.datasource.url=jdbc:mysql://localhost:3306/pawfind?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=pawfind_app
#${DB_PASSWORD} 表示：Spring Boot 会从环境变量中读取数据库密码。
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT 签名密钥（从环境变量读取）
jwt.secret=${JWT_SECRET}

# JWT 有效期：2 小时（毫秒）
jwt.expiration-ms=7200000

# 单张上传文件最大5MB
spring.servlet.multipart.max-file-size=5MB

# 整个上传请求最大6MB
spring.servlet.multipart.max-request-size=6MB

# 本地图片存储目录
pawfind.upload-dir=uploads

# DeepSeek / Spring AI。默认关闭，确保没有 Key 时普通功能仍能启动。
# 启动 AI 前设置：DEEPSEEK_API_KEY、SPRING_AI_MODEL_CHAT=deepseek。
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
spring.ai.deepseek.chat.model=${DEEPSEEK_MODEL:deepseek-flash}
spring.ai.deepseek.chat.temperature=${DEEPSEEK_TEMPERATURE:0.4}
spring.ai.deepseek.chat.max-tokens=${DEEPSEEK_MAX_TOKENS:1600}

# 避免上游短暂故障导致过久等待或产生过多重复请求。
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=5s
spring.http.clients.connect-timeout=10s
spring.http.clients.read-timeout=90s
pawfind.ai.stream-timeout-seconds=90
pawfind.ai.context-message-limit=20
